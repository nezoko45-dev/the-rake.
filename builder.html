<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rake Game Builder</title><link rel="stylesheet" href="builder.css"></head><body><header><div><b>RAKE</b><h1>Game Builder</h1></div><div class="actions"><button id="new">New</button><button id="save">Save</button><button id="export">Export HTML</button></div></header><nav><button class="tab active" data-page="scene">Scene</button><button class="tab" data-page="code">Code</button><button class="tab" data-page="play">Play</button></nav><main><section id="scene" class="page active"><aside><h2>Objects</h2><div id="objects"></div><button id="add">+ Add object</button></aside><article><canvas id="canvas" width="800" height="450"></canvas><div class="inspector"><h2>Inspector</h2><label>Name<input id="name"></label><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>Size<input id="size" type="number"></label><label>Color<input id="color" type="color"></label></div></article></section><section id="code" class="page"><h2>JavaScript</h2><textarea id="editor"></textarea></section><section id="play" class="page"><div class="playbar"><h2>Game Preview</h2><button id="run">Run</button></div><iframe id="frame" sandbox="allow-scripts"></iframe></section></main><footer id="status">Ready</footer><script src="builder.js"></script></body></html>

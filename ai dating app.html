<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mira - AI Companion</title>
    <style>
        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0a0e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* ─── LUNA AVATAR ─── */
        #avatar-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #avatar-container img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.05s ease;
            image-rendering: auto;
        }
        #avatar-closed {
            opacity: 1;
        }
        #avatar-open {
            opacity: 0;
        }

        /* ─── SPEAKING STATE ─── */
        #avatar-container.speaking #avatar-closed {
            opacity: 0;
        }
        #avatar-container.speaking #avatar-open {
            opacity: 1;
        }

        /* ─── FLICKER EFFECT (while speaking) ─── */
        #avatar-container.speaking .flicker-overlay {
            opacity: 1;
            animation: flicker 0.08s infinite alternate;
        }

        .flicker-overlay {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                rgba(168, 85, 247, 0.15) 0%,
                rgba(124, 58, 237, 0.08) 30%,
                transparent 70%
            );
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
            mix-blend-mode: screen;
        }

        @keyframes flicker {
            0% {
                opacity: 0.3;
                transform: scale(0.98);
            }
            25% {
                opacity: 0.8;
                transform: scale(1.02);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.99);
            }
            75% {
                opacity: 1;
                transform: scale(1.01);
            }
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
        }

        /* ─── MIC MONITOR (visual feedback) ─── */
        #mic-monitor {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            height: 30px;
        }
        #mic-monitor.active {
            opacity: 1;
        }
        .bar {
            width: 4px;
            height: 6px;
            background: linear-gradient(to top, #7c3aed, #a855f7);
            border-radius: 2px;
            transition: height 0.05s ease;
            transform-origin: bottom;
        }

        /* ─── GLOW RING (pulsing while listening) ─── */
        #avatar-container.listening::before {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2), transparent 70%);
            animation: pulse-ring 1.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-ring {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.9;
            }
        }

        /* subtle glow behind avatar */
        #avatar-container::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        /* ─── STATUS & TRANSCRIPT ─── */
        #status-text {
            font-size: 14px;
            letter-spacing: 0.5px;
            opacity: 0.6;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
            margin-bottom: 8px;
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #status-text .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: all 0.3s;
        }
        #status-text.listening .dot {
            background: #7bf5a0;
            animation: blink-dot 0.5s infinite;
        }
        #status-text.speaking .dot {
            background: #f5a0d0;
            animation: blink-dot 0.3s infinite;
        }

        @keyframes blink-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        #transcript {
            max-width: 480px;
            text-align: center;
            font-size: 18px;
            font-weight: 300;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.55);
            padding: 14px 28px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            margin-bottom: 16px;
            max-width: 90%;
        }
        #transcript .placeholder {
            opacity: 0.3;
            font-size: 15px;
        }
        #transcript .user-msg {
            color: #b0d0ff;
        }
        #transcript .mira-msg {
            color: #ffb0d0;
        }
        #transcript .interim {
            color: #8888aa;
            font-style: italic;
        }

        /* ─── BUTTONS ─── */
        .btn-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #ccc;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.14);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            border: none;
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.3);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #b86ff7, #8b4df0);
            box-shadow: 0 8px 40px rgba(124, 58, 237, 0.5);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.35);
        }

        .btn-sm {
            padding: 10px 20px;
            font-size: 13px;
        }

        /* ─── SETTINGS PANEL ─── */
        #settings-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(11, 10, 14, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px 24px;
            min-width: 250px;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        #settings-panel.open {
            display: flex;
        }
        #settings-panel label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.5;
        }
        #settings-panel input,
        #settings-panel select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        #settings-panel input:focus,
        #settings-panel select:focus {
            border-color: #7c3aed;
        }
        #settings-panel .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #settings-panel .row label {
            text-transform: none;
            opacity: 0.7;
            font-size: 13px;
        }

        /* ─── GEAR BUTTON ─── */
        #gear-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gear-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: rotate(60deg);
        }
        #gear-btn.active {
            background: rgba(124, 58, 237, 0.2);
            border-color: #7c3aed;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            #avatar-container {
                max-width: 350px;
            }
            #transcript {
                font-size: 15px;
                padding: 12px 18px;
                min-height: 50px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
            #settings-panel {
                top: 10px;
                right: 10px;
                min-width: 200px;
                padding: 16px;
            }
        }

        /* loading state for images */
        .loading #avatar-container {
            opacity: 0.3;
        }
        .loading #avatar-container::after {
            content: 'Loading Luna...';
            position: absolute;
            color: #888;
            font-size: 14px;
        }

        /* volume meter bars */
        .bar.active {
            background: linear-gradient(to top, #7bf5a0, #a855f7);
        }
    </style>
</head>
<body>

    <!-- GEAR / SETTINGS -->
    <button id="gear-btn" title="Settings">⚙️</button>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel">
        <label>Deepgram API Key</label>
        <input type="password" id="dg-key" placeholder="paste your key here" />
        <label>Voice</label>
        <select id="voice-select">
            <option value="aura-asteria-en">Asteria (Female)</option>
            <option value="aura-luna-en" selected>Luna (Female)</option>
            <option value="aura-oreas-en">Oreas (Male)</option>
            <option value="aura-orion-en">Orion (Male)</option>
        </select>
        <div class="row">
            <input type="checkbox" id="use-fallback" checked />
            <label for="use-fallback">Use fallback STT if no key</label>
        </div>
        <button class="btn btn-primary btn-sm" id="save-settings">Save</button>
    </div>

    <!-- LUNA AVATAR -->
    <div id="avatar-container">
        <div class="flicker-overlay"></div>
        <img id="avatar-closed" src="luna mouth closed.png" alt="Luna - mouth closed" />
        <img id="avatar-open" src="luna mouth open.png" alt="Luna
